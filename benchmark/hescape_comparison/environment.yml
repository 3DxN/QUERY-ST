name: hescape_comparison
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip>=24

  # Server/GPU PyTorch build. Change 12.1 to your cluster's recommended
  # CUDA runtime if needed, for example pytorch-cuda=12.4.
  - pytorch
  - torchvision
  - pytorch-cuda=12.1

  # Data and utility stack used directly by the lung runner and official
  # HESCAPE modules imported by it.
  - numpy>=2.0,<2.3
  - pandas>=2.2
  - pillow>=10
  - scikit-learn>=1.5
  - scikit-misc>=0.5
  - matplotlib-base
  - tqdm
  - anndata
  - h5py
  - ipykernel

  - pip:
      - lightning==2.6.5
      - pytorch-lightning==2.6.5
      - timm==1.0.24
      - open-clip-torch==3.3.0
      - torchmetrics==1.9.0
      - peft==0.19.1
      - omegaconf==2.3.1
      - einops==0.8.2
      - local-attention==1.11.2
      - datasets>=4
      - hydra-core>=1.3.2
      - hydra-joblib-launcher>=1.2
      - hydra-submitit-launcher>=1.2
      - session-info2
